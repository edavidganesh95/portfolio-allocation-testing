[project]
name = "portfolio-allocation-testing"
version = "1.2.0"
description = "A returns-only strategic ETF allocation research engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "streamlit>=1.44",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "yfinance>=0.2.54",
    "altair>=5.5",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # Streamlit widgets are called in argument position by design
    "SIM108",  # explicit if/else often reads better than a ternary here
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]        # page config must run before other Streamlit calls
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run as a bare `pytest`, not only `python -m pytest`.
pythonpath = ["."]
# No -q here: it stacks with a caller's -q and hides the summary line.
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:streamlit.*",
    "ignore:.*ScriptRunContext.*:UserWarning",
]
